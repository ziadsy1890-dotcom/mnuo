<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنيو الإلكتروني</title>
<style>
:root {
  --primary-color: #122b20;
  --accent-color: #d4af37;
  --bg-color: #f8faf9;
  --card-bg-color: #ffffff;
  --card-text-color: #0f172a;
}
body { font-family: Tahoma, Arial, sans-serif; background-color: var(--bg-color); color: var(--card-text-color); margin: 0; padding: 0; }
.header { background: var(--primary-color); color: #fff; text-align: center; padding: 25px 15px; background-size: cover; background-position: center; }
.header h1 { margin: 0; font-size: 24px; }
.container { max-width: 800px; margin: 15px auto; padding: 0 12px; }

/* الأقسام */
.categories-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
.categories-nav button { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; white-space: nowrap; }
.categories-nav button.active { background: var(--primary-color); color: #fff; }

/* شبكة المنتجات */
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
.product-card { background: var(--card-bg-color); border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
.product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
.product-card h3 { margin: 10px 0 5px 0; font-size: 16px; color: var(--card-text-color); }
.product-card p { font-size: 12px; color: #64748b; margin: 0 0 10px 0; }
.product-card .price { font-weight: bold; color: var(--primary-color); margin-bottom: 10px; }

.btn { background: var(--primary-color); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }

/* السلة Floating Bar */
.cart-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; max-width: 770px; margin: 0 auto; background: var(--primary-color); color: #fff; padding: 12px 20px; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; font-weight: bold; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
.modal-card { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
</style>
</head>
<body>

<div class="header" id="mainHeader">
  <h1 id="storeTitle">المتجر الإلكتروني</h1>
</div>

<div class="container">
  <!-- قائمة الأقسام -->
  <div class="categories-nav" id="categoriesNav"></div>

  <!-- شبكة المنتجات -->
  <div class="products-grid" id="productsGrid">جاري التحميل...</div>
</div>

<!-- زر السلة العائم -->
<div class="cart-bar" id="cartBar" style="display: none;" onclick="openCartModal()">
  <span>🛒 إتمام الطلب (<span id="cartCount">0</span>)</span>
  <span id="cartTotal">0 جنيه</span>
</div>

<!-- مودال إتمام الطلب -->
<div class="modal-overlay" id="cartModal">
  <div class="modal-card">
    <h3 style="margin-top:0;">📋 تفاصيل الطلب</h3>
    <div id="cartItemsList" style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;"></div>
    
    <div class="form-group"><label>الاسم الكامل *</label><input type="text" id="custName"></div>
    <div class="form-group"><label>رقم الهاتف *</label><input type="tel" id="custPhone"></div>
    <div class="form-group"><label>منطقة التوصيل *</label><select id="deliveryZoneSelect" onchange="calculateGrandTotal()"></select></div>
    <div class="form-group"><label>العنوان التفصيلي *</label><input type="text" id="custAddress"></div>

    <div style="margin: 15px 0; font-size: 16px; font-weight: bold;">
      الإجمالي النهائي: <span id="finalGrandTotal" style="color:var(--primary-color);">0 جنيه</span>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="btn" style="background:#10b981;" onclick="submitOrder()">إرسال الطلب عبر الواتساب 💬</button>
      <button class="btn" style="background:#64748b;" onclick="closeCartModal()">إلغاء</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBNy3ZPbr_cVJC2ZUzBVf8jxWdFlABYIiw",
    authDomain: "pista-7a180.firebaseapp.com",
    projectId: "pista-7a180",
    storageBucket: "pista-7a180.firebasestorage.app",
    messagingSenderId: "581989151860",
    appId: "1:581989151860:web:ffb4a82297933ac6f90d21"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let products = [], categories = [], deliveryZones = [], cart = [];
  let whatsappNum = "", selectedCategory = "all";

  // استماع لإعدادات المتجر والمنتجات
  onSnapshot(doc(db, "settings", "store"), snap => {
    if(snap.exists()) {
      const data = snap.data();
      if(data.storeName) document.getElementById("storeTitle").innerText = data.storeName;
      if(data.whatsappNumber) whatsappNum = data.whatsappNumber;
      if(data.deliveryZones) { deliveryZones = data.deliveryZones; renderZones(); }
      
      // ثيمات وألوان
      if(data.theme) {
        document.documentElement.style.setProperty('--primary-color', data.theme.primaryColor || '#122b20');
        document.documentElement.style.setProperty('--accent-color', data.theme.accentColor || '#d4af37');
        document.documentElement.style.setProperty('--bg-color', data.theme.bgColor || '#f8faf9');
        document.documentElement.style.setProperty('--card-bg-color', data.theme.cardBgColor || '#ffffff');
        document.documentElement.style.setProperty('--card-text-color', data.theme.cardTextColor || '#0f172a');
        if(data.theme.menuBgImage) document.getElementById("mainHeader").style.backgroundImage = `url('${data.theme.menuBgImage}')`;
      }

      // الأقسام
      if(data.categoriesList) {
        categories = data.categoriesList.filter(c => !c.hidden).map(c => c.name);
      } else {
        categories = data.categories || [];
      }
      renderCategories();
    }
  });

  onSnapshot(collection(db, "products"), snap => {
    products = [];
    snap.forEach(d => {
      const p = d.data();
      if(!p.hidden) products.push({ id: d.id, ...p });
    });
    renderProducts();
  });

  function renderCategories() {
    const nav = document.getElementById("categoriesNav");
    nav.innerHTML = `<button class="${selectedCategory === 'all' ? 'active' : ''}" onclick="window.filterCat('all')">الكل</button>` + 
      categories.map(c => `<button class="${selectedCategory === c ? 'active' : ''}" onclick="window.filterCat('${c}')">${c}</button>`).join("");
  }

  window.filterCat = (cat) => {
    selectedCategory = cat;
    renderCategories();
    renderProducts();
  };

  function renderProducts() {
    const grid = document.getElementById("productsGrid");
    const filtered = selectedCategory === 'all' ? products : products.filter(p => p.category === selectedCategory);

    if(!filtered.length) return grid.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>لا توجد منتجات في هذا القسم.</p>";

    grid.innerHTML = filtered.map(p => `
      <div class="product-card">
        <img src="${p.images?.[0] || p.image || 'https://via.placeholder.com/150'}">
        <h3>${p.name}</h3>
        <p>${p.description || ''}</p>
        <div class="price">${p.price} جنيه</div>
        <button class="btn" onclick="window.addToCart('${p.id}')">➕ أضف إلى السلة</button>
      </div>
    `).join("");
  }

  window.addToCart = (id) => {
    const p = products.find(i => i.id === id);
    if(!p) return;
    const exist = cart.find(i => i.id === id);
    if(exist) { exist.qty += 1; }
    else { cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 }); }
    updateCartUI();
  };

  function updateCartUI() {
    const count = cart.reduce((sum, i) => sum + i.qty, 0);
    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    document.getElementById("cartCount").innerText = count;
    document.getElementById("cartTotal").innerText = total + " جنيه";
    document.getElementById("cartBar").style.display = count > 0 ? "flex" : "none";
  }

  window.openCartModal = () => {
    const list = document.getElementById("cartItemsList");
    list.innerHTML = cart.map((i, idx) => `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span>${i.name} (x${i.qty})</span>
        <span>${i.price * i.qty} ج <button onclick="window.removeFromCart(${idx})" style="background:none; border:none; color:red; cursor:pointer;">❌</button></span>
      </div>
    `).join("");
    calculateGrandTotal();
    document.getElementById("cartModal").style.display = "flex";
  };

  window.removeFromCart = (idx) => {
    cart.splice(idx, 1);
    updateCartUI();
    if(!cart.length) window.closeCartModal();
    else window.openCartModal();
  };

  window.closeCartModal = () => document.getElementById("cartModal").style.display = "none";

  function renderZones() {
    const sel = document.getElementById("deliveryZoneSelect");
    sel.innerHTML = deliveryZones.map((z, idx) => `<option value="${idx}">${z.name} (+${z.fee} ج)</option>`).join("");
  }

  window.calculateGrandTotal = () => {
    const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const zoneIdx = document.getElementById("deliveryZoneSelect").value;
    const fee = deliveryZones[zoneIdx] ? deliveryZones[zoneIdx].fee : 0;
    document.getElementById("finalGrandTotal").innerText = (subtotal + fee) + " جنيه";
  };

  window.submitOrder = async () => {
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    const zoneIdx = document.getElementById("deliveryZoneSelect").value;

    if(!name || !phone || !address) return alert("يرجى ملء كافة البيانات المطلوبة!");

    const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const deliveryFee = deliveryZones[zoneIdx] ? deliveryZones[zoneIdx].fee : 0;
    const grandTotal = subtotal + deliveryFee;

    const orderData = {
      customer: { name, phone, address, zone: deliveryZones[zoneIdx]?.name || '' },
      items: cart,
      subtotal,
      deliveryFee,
      grandTotal,
      status: "new",
      createdAt: Date.now()
    };

    try {
      // 1. حفظ الطلب في Firestore
      const docRef = await addDoc(collection(db, "orders"), orderData);

      // 2. توجيه واتساب
      let msg = `🛍️ *طلب جديد من المتجر #${docRef.id.substring(0,6)}*\n\n`;
      msg += `👤 *العميل:* ${name}\n📞 *الهاتف:* ${phone}\n📍 *العنوان:* ${address}\n\n`;
      msg += `📦 *الطلبات:*\n` + cart.map(i => `- ${i.name} (${i.qty}) = ${i.price * i.qty} ج`).join('\n');
      msg += `\n\n🛵 *التوصيل:* ${deliveryFee} جنيه\n💰 *الإجمالي النهائي:* ${grandTotal} جنيه`;

      if(whatsappNum) {
        window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, '_blank');
      }

      cart = [];
      updateCartUI();
      closeCartModal();
      alert("✨ تم إرسال الطلب بنجاح!");
    } catch(e) {
      alert("حدث خطأ أثناء إرسال الطلب: " + e.message);
    }
  };
</script>

</body>
</html>
