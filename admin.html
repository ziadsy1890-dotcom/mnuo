<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | بيستاش دي ألب</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 20px; }
    .admin-card { background: #fff; padding: 24px; border-radius: 16px; max-width: 600px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 20px; color: #11261d; font-size: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 8px; color: #334155; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 12px; background: #f8fafc; padding: 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; }
    input[type="color"] { border: none; width: 45px; height: 45px; border-radius: 8px; cursor: pointer; background: none; }
    .btn-save { width: 100%; padding: 14px; background: #11261d; color: #fff; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 12px rgba(17, 38, 29, 0.2); }
    .btn-save:hover { background: #1a382b; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>🎨 تخصيص ألوان الهيدر والواجهة</h2>
    
    <!-- بطاقة تخصيص لون مستطيل الهيدر -->
    <div class="form-group">
      <label>لون مستطيل الهيدر العلوي (اسم المتجر والبحث)</label>
      <div class="color-picker-wrapper">
        <input type="color" id="headerBgColorInput" value="#11261d">
        <span style="font-weight: 700; font-size: 13px; color: #64748b;">اختر اللون المناسب للهيدر</span>
      </div>
    </div>

    <!-- بطاقة تخصيص اللون الرئيسي -->
    <div class="form-group">
      <label>اللون الرئيسي للمتجر (Primary)</label>
      <div class="color-picker-wrapper">
        <input type="color" id="primaryColorInput" value="#11261d">
        <span style="font-weight: 700; font-size: 13px; color: #64748b;">لون الأزرار والأيقونات الأساسية</span>
      </div>
    </div>

    <!-- بطاقة تخصيص اللون الفرعي -->
    <div class="form-group">
      <label>اللون الفرعي/التأكيدي (Accent)</label>
      <div class="color-picker-wrapper">
        <input type="color" id="accentColorInput" value="#d4af37">
        <span style="font-weight: 700; font-size: 13px; color: #64748b;">لون الإطار والخطوط المميزة</span>
      </div>
    </div>

    <button class="btn-save" onclick="saveThemeSettings()">💾 حفظ التعديلات</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBNy3ZPbr_cVJC2ZUzBVf8jxWdFlABYIiw",
      authDomain: "pista-7a180.firebaseapp.com",
      projectId: "pista-7a180",
      storageBucket: "pista-7a180.firebasestorage.app",
      messagingSenderId: "581989151860",
      appId: "1:581989151860:web:ffb4a82297933ac6f90d21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // تحميل الإعدادات الحالية عند فتح لوحة التحكم
    async function loadSettings() {
      const docRef = doc(db, "settings", "store");
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.theme) {
          if (data.theme.headerBgColor) document.getElementById("headerBgColorInput").value = data.theme.headerBgColor;
          if (data.theme.primaryColor) document.getElementById("primaryColorInput").value = data.theme.primaryColor;
          if (data.theme.accentColor) document.getElementById("accentColorInput").value = data.theme.accentColor;
        }
      }
    }

    // حفظ الإعدادات في Firebase و LocalStorage
    window.saveThemeSettings = async () => {
      const headerBgColor = document.getElementById("headerBgColorInput").value;
      const primaryColor = document.getElementById("primaryColorInput").value;
      const accentColor = document.getElementById("accentColorInput").value;

      const updatedTheme = {
        headerBgColor: headerBgColor,
        primaryColor: primaryColor,
        accentColor: accentColor
      };

      try {
        await setDoc(doc(db, "settings", "store"), { theme: updatedTheme }, { merge: true });
        
        // تحديث الذاكرة المحلية للتطبيق المباشر
        const cached = JSON.parse(localStorage.getItem('cached_store_theme') || '{}');
        localStorage.setItem('cached_store_theme', JSON.stringify({ ...cached, ...updatedTheme }));

        alert("تم حفظ لون الهيدر والإعدادات بنجاح! 🎉");
      } catch (e) {
        alert("حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.");
      }
    };

    loadSettings();
  </script>
</body>
</html>
