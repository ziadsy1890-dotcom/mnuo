<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | بيستاش دي ألب</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #11261d;
      --accent: #d4af37;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 10px; direction: rtl; }
    
    .admin-container { max-width: 700px; margin: 0 auto; }
    .header-title { text-align: center; margin-bottom: 25px; color: var(--primary); font-size: 24px; font-weight: 900; }
    
    .admin-card { 
      background: var(--card-bg); 
      padding: 22px; 
      border-radius: 18px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
      border: 1px solid var(--border);
    }

    .card-title { font-size: 17px; font-weight: 900; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 800; font-size: 13.5px; margin-bottom: 6px; color: #334155; }
    input[type="text"], input[type="url"], select { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border); outline: none; font-weight: 700; font-size: 14px; transition: border-color 0.2s; }
    input:focus { border-color: var(--primary); }

    .color-picker-wrapper { display: flex; align-items: center; gap: 12px; background: #f1f5f9; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--border); }
    input[type="color"] { border: none; width: 42px; height: 42px; border-radius: 8px; cursor: pointer; background: none; }
    .color-info { font-weight: 700; font-size: 12.5px; color: #64748b; }

    .btn-save { 
      width: 100%; padding: 15px; background: var(--primary); color: #fff; 
      font-weight: 900; border: none; border-radius: 14px; cursor: pointer; 
      font-size: 16px; box-shadow: 0 4px 15px rgba(17, 38, 29, 0.25); transition: transform 0.2s;
    }
    .btn-save:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1 class="header-title">⚙️ لوحة تحكم متجر بيستاش دي ألب</h1>

    <!-- قسم الإعدادات العامة -->
    <div class="admin-card">
      <div class="card-title"><i class="fa-solid fa-store"></i> الإعدادات الأساسية</div>
      <div class="form-group">
        <label>اسم المتجر</label>
        <input type="text" id="storeNameInput" placeholder="بيستاش دي ألب">
      </div>
      <div class="form-group">
        <label>رقم الواتساب للطلبات</label>
        <input type="text" id="whatsappInput" placeholder="201011406537">
      </div>
      <div class="form-group">
        <label>رابط صورة خلفية المنيو الكاملة (URL) 🖼️</label>
        <input type="url" id="menuBgImageInput" placeholder="https://example.com/background.jpg">
      </div>
    </div>

    <!-- قسم تخصيص الألوان والواجهة -->
    <div class="admin-card">
      <div class="card-title"><i class="fa-solid fa-palette"></i> تخصيص الألوان والهيدر</div>
      
      <!-- بطاقة تغيير لون الهيدر -->
      <div class="form-group">
        <label>لون مستطيل الهيدر العلوي (اسم المتجر والبحث) 🎨</label>
        <div class="color-picker-wrapper">
          <input type="color" id="headerBgColorInput" value="#11261d">
          <span class="color-info">اختر لون شريط التحكم العلوي</span>
        </div>
      </div>

      <!-- بطاقة اللون الرئيسي -->
      <div class="form-group">
        <label>اللون الرئيسي للمتجر (Primary)</label>
        <div class="color-picker-wrapper">
          <input type="color" id="primaryColorInput" value="#11261d">
          <span class="color-info">لون الأزرار العائمة والمناطق الأساسية</span>
        </div>
      </div>

      <!-- بطاقة اللون الفرعي -->
      <div class="form-group">
        <label>اللون الفرعي والتأكيدي (Accent)</label>
        <div class="color-picker-wrapper">
          <input type="color" id="accentColorInput" value="#d4af37">
          <span class="color-info">لون الحدود، الأيقونات والنصوص المميزة</span>
        </div>
      </div>

      <!-- بطاقة لون خلفية المنيو البديلة -->
      <div class="form-group">
        <label>لون خلفية الصفحة (عند عدم وجود صورة)</label>
        <div class="color-picker-wrapper">
          <input type="color" id="bgColorInput" value="#11261d">
          <span class="color-info">لون الخلفية الأساسي للمتجر</span>
        </div>
      </div>

      <!-- بطاقة لون كروت المنتجات -->
      <div class="form-group">
        <label>لون كروت المنتجات</label>
        <div class="color-picker-wrapper">
          <input type="color" id="cardBgColorInput" value="#ffffff">
          <span class="color-info">خلفية بطاقات المنتجات والأصناف</span>
        </div>
      </div>
    </div>

    <!-- زر حفظ التغييرات -->
    <button class="btn-save" onclick="window.saveAllSettings()">💾 حفظ كافة التعديلات والتطبيقات</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBNy3ZPbr_cVJC2ZUzBVf8jxWdFlABYIiw",
      authDomain: "pista-7a180.firebaseapp.com",
      projectId: "pista-7a180",
      storageBucket: "pista-7a180.firebasestorage.app",
      messagingSenderId: "581989151860",
      appId: "1:581989151860:web:ffb4a82297933ac6f90d21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // تحميل الإعدادات عند فتح اللوحة
    async function loadSettings() {
      try {
        const docRef = doc(db, "settings", "store");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.storeName) document.getElementById("storeNameInput").value = data.storeName;
          if (data.whatsappNumber) document.getElementById("whatsappInput").value = data.whatsappNumber;

          if (data.theme) {
            const t = data.theme;
            if (t.headerBgColor) document.getElementById("headerBgColorInput").value = t.headerBgColor;
            if (t.primaryColor) document.getElementById("primaryColorInput").value = t.primaryColor;
            if (t.accentColor) document.getElementById("accentColorInput").value = t.accentColor;
            if (t.bgColor) document.getElementById("bgColorInput").value = t.bgColor;
            if (t.cardBgColor) document.getElementById("cardBgColorInput").value = t.cardBgColor;
            if (t.menuBgImage) document.getElementById("menuBgImageInput").value = t.menuBgImage;
          }
        }
      } catch (e) {
        console.error("خطأ في تحميل البيانات:", e);
      }
    }

    // دالة حفظ التغييرات في Firebase وفي الذاكرة المحلية لتفادي الوميض
    window.saveAllSettings = async () => {
      const storeName = document.getElementById("storeNameInput").value.trim();
      const whatsappNumber = document.getElementById("whatsappInput").value.trim();
      const menuBgImage = document.getElementById("menuBgImageInput").value.trim();

      const theme = {
        headerBgColor: document.getElementById("headerBgColorInput").value,
        primaryColor: document.getElementById("primaryColorInput").value,
        accentColor: document.getElementById("accentColorInput").value,
        bgColor: document.getElementById("bgColorInput").value,
        cardBgColor: document.getElementById("cardBgColorInput").value,
        menuBgImage: menuBgImage
      };

      try {
        await setDoc(doc(db, "settings", "store"), {
          storeName: storeName,
          whatsappNumber: whatsappNumber,
          theme: theme
        }, { merge: true });

        // حفظ متزامن في localstorage للتطبيق الفوري وبدون وميض
        localStorage.setItem('cached_store_theme', JSON.stringify(theme));
        if (storeName) localStorage.setItem('cached_store_name', storeName);

        alert("تم حفظ جميع التعديلات بنجاح! 🎉");
      } catch (e) {
        alert("حدث خطأ أثناء حفظ التعديلات، يرجى المحاولة مرة أخرى.");
      }
    };

    loadSettings();
  </script>
</body>
</html>
